# Metadata
domain: s2p
version: "v0.3"
tensor_shape: [5, 5, 8]
notes: >
  Supply-to-Pay (S2P) domain — 5 risk categories, 5 actions, 8 domain-level factor scores.
  Centroids are structured placeholders (no real S2P training data).
  Correlation prior from two-judge research (Regime A baseline, 28 pairs).
  Replace action_conditional_profiles with calibrated values after factorial.
  correlation_prior is used by synthetic generators, not the ProfileScorer directly.
