# Correlation prior — Regime A (baseline, no active disruption).
# Two-judge research, 28 correlation pairs.
# Factor ordering: supplier_risk (SUP), logistics_risk (LOG), demand_risk (DEM),
#   inventory_risk (INV), regulatory_risk (REG), geopolitical_risk (GEO),
#   financial_risk (FIN), environmental_risk (ENV).
# Used by the synthetic data generator; not consumed by the scorer directly.
correlation_prior:
  - [1.00, 0.48, 0.35, 0.62, 0.45, 0.58, 0.70, 0.50]
  - [0.48, 1.00, 0.42, 0.60, 0.40, 0.55, 0.38, 0.65]
